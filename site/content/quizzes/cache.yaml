# Pilot quiz. Every question is drawn from the Cache page. Set `reviewed: true` only after a second
# person has checked each answer against the linked section (see CONTENT_GUIDE.md).
topic: learn/cache/
reviewed: false
questions:
  - id: cache-aside-who-loads
    q: In cache-aside, which component loads data into the cache after a cache miss?
    choices:
      - The cache itself
      - The application
      - The database
      - A background refresh job
    answer: 1
    why: The application looks in the cache, loads the entry from the database on a miss, and adds it to the cache. The cache never talks to storage directly.
    link: "#cache-aside"
    difficulty: 1

  - id: cache-aside-miss-cost
    q: Why can a single cache miss under cache-aside cause a noticeable delay?
    choices:
      - It takes three trips - check the cache, read the database, write the cache
      - The cache locks the entry it is loading, so other readers queue behind it
      - The miss evicts older entries first, and eviction blocks other requests
      - The database must re-check the cached copy before it answers the read
    answer: 0
    why: A miss costs a failed cache lookup, a database read and a cache write. That is three trips instead of one, which is why a cold cache feels slow.
    link: "#disadvantages-cache-aside"
    difficulty: 1

  - id: write-through-trade-off
    q: What is the main trade-off of write-through caching?
    choices:
      - Recently written data stays stale in the cache until its entry expires
      - Only data that has already been read once ever ends up in the cache
      - Each write goes to the cache and the database, so writes are slower
      - Writes can be lost if the cache fails before they reach the database
    answer: 2
    why: The application writes to the cache and the cache writes to the database, so writing is slow overall. In return, recently written data is already cached and current. Users tolerate latency on updates better than on reads.
    link: "#write-through"
    difficulty: 2

  - id: write-behind-risk
    q: A team adopts write-behind caching to speed up writes. What is the main risk they take on?
    choices:
      - Every read of newly written data misses the cache until the write lands
      - Updates can be lost if the cache fails before they reach the data store
      - Reads return the old value until the database confirms each update
      - The database has to be rebuilt whenever a cache node is added or removed
    answer: 1
    why: Write-behind updates the cache and writes to the data store asynchronously. If the cache goes down before that write happens, the update is gone. It is also harder to implement than cache-aside or write-through.
    link: "#write-behind-write-back"
    difficulty: 2

  - id: cache-node-replaced
    q: In a cache-aside system, a cache node fails and is replaced by a new, empty node. What happens to read latency?
    choices:
      - It rises until cache misses have refilled the new node
      - It stays the same, because the database fills the new node at once
      - It drops, because an empty node has fewer entries to search
      - Reads fail until the application restarts and reconnects
    answer: 0
    why: Entries are only added on a miss, so the new node starts cold and every first request pays the full three-trip cost. Latency recovers as the node warms up.
    link: "#disadvantages-cache-aside"
    difficulty: 2

  - id: query-level-caching-hard
    q: Why is caching at the database query level hard to keep correct?
    choices:
      - Query results are usually too large to keep in memory for long
      - Cached results expire too quickly to help under heavy load
      - The database already caches every result, so a second copy conflicts
      - One changed value means deleting every cached query that may hold it
    answer: 3
    why: A query result is keyed by the query, but it can contain many rows. Changing one table cell means finding and deleting every cached query that could include it, which is hard for complex queries. Caching whole objects is easier to invalidate.
    link: "#caching-at-the-database-query-level"
    difficulty: 3
