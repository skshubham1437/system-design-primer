# Questions about the capacity estimator lab. reviewed: true only after a second person checks.
topic: labs/estimator/
reviewed: false
questions:
  - id: est-qps
    q: How do you turn daily requests into an average rate per second?
    choices:
      - Divide by 3,600, the number of seconds in one hour
      - Divide by 86,400, the seconds in a day (round it to 100,000)
      - Divide by 1,440, the number of minutes in a whole day
      - Multiply by the peak factor, then divide by the number of servers
    answer: 1
    why: A day has 86,400 seconds. Rounding aggressively is fine as long as you say so.
    link: "#how-to-read-the-numbers"
    difficulty: 1
  - id: est-peak
    q: Why size the system for peak rather than average traffic?
    choices:
      - Averages are hard to measure, so the peak is a safer number to use
      - Peak traffic is always exactly ten times the daily average
      - Storage grows with peak traffic, so disks must be sized for it
      - Traffic is never flat, and the busiest moments are what must hold up
    answer: 3
    why: The peak factor multiplies the average to estimate the busiest second.
    difficulty: 1
  - id: est-headroom
    q: Why does the estimator size servers at 70% busy instead of 100%?
    choices:
      - Latency climbs steeply near full load, so the last part is unusable
      - Servers cannot run above 70% busy, because the CPU throttles itself
      - Running at 70% saves storage, because fewer logs get written
      - Cloud providers require it and stop servers that run any hotter
    answer: 0
    why: As the load curve lab shows, a server at 90% busy answers about ten times slower than an idle one.
    link: "#how-to-read-the-numbers"
    difficulty: 2
  - id: est-storage
    q: Which factors multiply into total storage in the estimator?
    choices:
      - Reads per day × read size × 365 × years
      - Peak writes per second × write size × replicas × overhead
      - Writes per day × write size × 365 × years × replicas × overhead
      - Users × average profile size × replicas × the read-to-write ratio
    answer: 2
    why: Storage grows with what is written, kept for the retention period, copied for durability, and inflated by indexes and metadata.
    difficulty: 2
  - id: est-ratio
    q: What does a read-to-write ratio of 100 to 1 suggest first?
    choices:
      - Caching and read replicas, which take most of the load first
      - Sharding the writes right away, before anything else is done
      - A write-optimised store, such as an LSM-tree database
      - Nothing yet; the ratio only matters once writes start to grow
    answer: 0
    why: When reads dominate, serving them from caches and replicas removes most of the load.
    difficulty: 1
