# Questions about the cache eviction lab. reviewed: true only after a second person checks.
topic: labs/cache-eviction/
reviewed: false
questions:
  - id: ce-loop
    q: Requests loop over one key more than the cache holds. What happens to LRU?
    choices:
      - It hits about half the time, the same as random eviction here
      - It hits every time once the first pass through the loop is over
      - It matches the optimal policy, because the loop order is predictable
      - It misses every time, because it evicts the key needed next
    answer: 3
    why: The least recently used key is exactly the one the loop asks for next. LRU, FIFO and LFU all hit 0% on the loop pattern; random eviction does far better.
    link: "#what-to-notice"
    difficulty: 2
  - id: ce-scan
    q: Why does LFU beat LRU on "hot keys plus scans"?
    choices:
      - LFU fits more keys in the same memory, so the hot set is never evicted
      - One-off scan keys push hot keys out of LRU; LFU keeps keys used many times
      - LFU predicts the scan's next keys and evicts exactly the ones not needed
      - Scans make LRU's bookkeeping slow, so it falls behind the requests
    answer: 1
    why: LRU treats a key seen once a moment ago as more valuable than a hot key seen a little earlier, so a scan flushes the hot set. Counting uses protects it.
    difficulty: 2
  - id: ce-2q
    q: How does 2Q resist scans?
    choices:
      - It refuses to cache any key that it has not seen at least twice
      - It evicts keys at random, so a scan cannot target the hot keys
      - New keys wait in a small FIFO area and are promoted if asked for again
      - It counts every request ever made and evicts whichever key is least requested
    answer: 2
    why: One pass over cold keys only churns the small probation area. The price is that a newly popular key must prove itself twice, so 2Q did slightly worse on plain hot keys.
    link: "#a-fix-for-scans-and-its-price"
    difficulty: 3
  - id: ce-optimal
    q: Why is the "optimal" policy shown if no real cache can use it?
    choices:
      - It is the policy Redis uses by default, so it shows real behaviour
      - It is the best possible, a ceiling to compare with; it needs the future
      - It is the cheapest policy to compute, so it is a baseline for speed
      - It only works for small caches, so it shows what a small cache could reach
    answer: 1
    why: Evicting the key needed furthest in the future is provably best, but requires knowing the future. It shows how much room for improvement is left.
    difficulty: 1
  - id: ce-uniform
    q: On uniformly random traffic, how do the real policies compare?
    choices:
      - LRU is far ahead, because recently used keys come back most often
      - Random eviction always wins, because the traffic itself is random
      - They all reach 100% once the cache holds half of the keys
      - They land within about ten points of each other, well below optimal
    answer: 3
    why: Requests with no pattern give no policy anything to predict, so they all do about the same.
    difficulty: 1
