# Questions about the message queue lab. reviewed: true only after a second person checks.
topic: labs/message-queue/
reviewed: false
questions:
  - id: mq-mismatch
    q: The producer sends 6 messages per tick and consumers handle 4. What happens without back pressure?
    choices:
      - The queue stays short, because consumers catch up between ticks
      - The queue fills to its limit, and then messages are dropped
      - The consumers speed up to match the producer once the queue fills
      - The producer slows down by itself once the queue starts to grow
    answer: 1
    why: A queue absorbs bursts, not a permanent mismatch. More buffer only delays the drops.
    difficulty: 1
  - id: mq-backpressure
    q: With back pressure on and the producer still faster than the consumers, where does the extra work go?
    choices:
      - It is dropped at the queue, just as it would be without back pressure
      - It is picked up by extra consumers that start automatically
      - It is absorbed by the queue, whose limit grows to fit the load
      - It waits at the producer, and that backlog keeps on growing
    answer: 3
    why: Back pressure moves the queue upstream rather than creating capacity. Only more consumers, or less input, fix a permanent mismatch.
    difficulty: 2
  - id: mq-burst
    q: When is a queue the right tool?
    choices:
      - To absorb short bursts when consumers keep up on average
      - To fix a producer that is always faster than its consumers
      - To make each message take less time to process
      - To avoid running any consumers during busy periods
    answer: 0
    why: A mostly empty queue swallows a spike and drains afterwards. A permanent mismatch only grows it.
    difficulty: 1
  - id: mq-wait
    q: What does the "wait for a new message" figure measure?
    choices:
      - The time a consumer takes to process one message on its own
      - The network delay between the producer and the queue server
      - How long a new message waits behind everything queued ahead of it
      - How long a consumer holds a message before acknowledging it
    answer: 2
    why: A queue converts a speed mismatch into waiting time, and this figure is that waiting time, including the producer's backlog.
    difficulty: 2
  - id: mq-web
    q: In a web system, what does back pressure usually look like to a client?
    choices:
      - A server-busy response, such as 503, and a retry later with backoff
      - A slower page that always succeeds in the end, however long it takes
      - A dropped connection with no response and no sign of why
      - A success response, with the work quietly discarded behind it
    answer: 0
    why: When the queue is full the server refuses new work, pushing the pressure back to the caller, who should retry with backoff.
    difficulty: 1
