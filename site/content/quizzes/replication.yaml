# Questions about the replication lab. reviewed: true only after a second person checks.
topic: labs/replication/
reviewed: false
questions:
  - id: rep-async-loss
    q: With asynchronous replication, the primary crashes right after acknowledging two writes. What can happen?
    choices:
      - Nothing is lost; replicas always have every acknowledged write
      - Writes the client was told succeeded are lost, because they had not reached any replica
      - The client is told the writes failed
      - The replicas refuse to be promoted
    answer: 1
    why: Async replication acknowledges first and copies later, buying speed by risking acknowledged data.
    difficulty: 1
  - id: rep-stale-read
    q: In async mode, a client writes and immediately reads from a replica. What does it see?
    choices:
      - Always the new value
      - An error
      - Possibly the old value, a stale read, until the replica catches up
      - Nothing; replicas cannot be read
    answer: 2
    why: The gap until a replica catches up is the replication lag. Reads from replicas are eventually consistent.
    difficulty: 1
  - id: rep-semi
    q: What does semi-synchronous replication wait for before acknowledging a write?
    choices:
      - Every replica to have it
      - One replica to have it
      - Nothing
      - The client to confirm
    answer: 1
    why: Waiting for one replica means a crash of the primary loses nothing acknowledged, without waiting for a far-away replica on every write.
    difficulty: 2
  - id: rep-sync-cost
    q: What is the cost of fully synchronous replication?
    choices:
      - Acknowledged writes can be lost
      - Reads become stale
      - Replicas cannot serve reads
      - Every write waits for the slowest replica, and a missing replica can block writes in a strict setup
    answer: 3
    why: Synchronous replication trades write latency (and availability when replicas fail) for durability.
    difficulty: 1
  - id: rep-ryw
    q: How does "read your own writes" stop a user missing what they just saved?
    choices:
      - Their reads go to the primary until the replicas have caught up
      - Replicas are made synchronous
      - Reads are delayed by a fixed amount
      - The write is repeated on every replica
    answer: 0
    why: Routing that user's reads to the primary for a while, or waiting for a replica to reach the write's position, gives them consistency where it matters without slowing everyone.
    difficulty: 2
