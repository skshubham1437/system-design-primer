# Questions about the load curve lab. reviewed: true only after a second person checks.
topic: labs/load-curve/
reviewed: false
questions:
  - id: lc-half-busy
    q: In the lab's model, how long does a request take when a server is 50% busy, compared with an idle server?
    choices:
      - The same
      - Ten times as long
      - About twice as long
      - Half as long
    answer: 2
    why: Time in the system is the idle service time divided by (1 - utilisation). At 50% that is 1 / 0.5 = 2 times.
    difficulty: 1
  - id: lc-ninety
    q: Why is running servers at 90% busy a bad trade?
    choices:
      - Requests take about ten times their idle time, and small traffic increases make it far worse
      - Servers wear out faster
      - It uses more electricity
      - Throughput falls as utilisation rises
    answer: 0
    why: At 90% busy the model gives 1 / 0.1 = 10 times the idle time, and the curve is steepest near full load. The usual target is around 70% or below.
    difficulty: 1
  - id: lc-add-servers
    q: What does adding servers do in the lab, if traffic stays the same?
    choices:
      - Makes each request faster to compute
      - Raises throughput beyond demand
      - Nothing, unless the service time changes
      - Lowers each server's utilisation, so the marker slides back down the curve and waiting shrinks
    answer: 3
    why: Each server gets a smaller share of the traffic. No request gets cheaper, but there is less queueing, which is what horizontal scaling buys.
    difficulty: 1
  - id: lc-shared-queue
    q: Eight servers at 75% busy. Why does one shared queue beat a separate queue per server?
    choices:
      - Shared queues use faster hardware
      - With one queue no request waits behind a slow one while another server sits idle
      - A shared queue drops requests when busy
      - It does not; they are the same
    answer: 1
    why: In the model a request takes about 24 ms with one shared queue against 80 ms with separate queues. Any free server takes the next request.
    difficulty: 2
  - id: lc-over-capacity
    q: What happens when incoming traffic exceeds total capacity?
    choices:
      - Latency rises to a new, higher but steady level
      - Throughput keeps rising with traffic
      - Requests arrive faster than they are served, so the queue grows without limit
      - The servers speed up
    answer: 2
    why: Throughput is capped at capacity; beyond it the backlog grows forever, so response time is unbounded until traffic falls or capacity is added.
    difficulty: 1
