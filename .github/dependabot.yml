version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      markdown:
        patterns: ["unified", "remark-*", "rehype-*", "mdast-*", "hast-*", "unist-*", "shiki"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
