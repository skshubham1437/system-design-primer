name: External links

# The README links to a lot of third-party pages and some will rot. Check weekly and
# keep one open issue with the findings instead of failing builds.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --max-retries 2 --timeout 20
            --accept "100..=103,200..=299,403,429"
            --exclude-mail --exclude-path site --exclude "^https?://(localhost|127\.0\.0\.1)"
            README.md "solutions/**/*.md"
          output: lychee/report.md
          fail: false
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken external links
          content-filepath: lychee/report.md
          labels: maintenance
